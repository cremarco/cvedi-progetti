<!DOCTYPE html> <html lang=en> <head> <meta charset=UTF-8> <meta name=viewport content="width=device-width,initial-scale=1"> <meta name=description content="Gallery of projects from the CVeDI course, showcasing student work across different academic years"> <meta name=keywords content="CVeDI, projects, gallery, student work, academic years"> <meta name=author content="CVeDI Course"> <meta name=robots content="index, follow"> <meta property=og:title content="Progetti del corso di CVeDI"> <meta property=og:description content="Gallery of projects from the CVeDI course"> <meta property=og:type content=website> <title>Progetti del corso di CVeDI</title> <link rel=preload href=https://cdn.tailwindcss.com as=script> <link rel=preload href=gallery-data.json as=fetch crossorigin> <script src=https://cdn.tailwindcss.com></script> <script>tailwind.config={darkMode:"class"};</script> <style>:root{--transition-fast:0.3s ease;--transition-smooth:0.4s cubic-bezier(0.4, 0, 0.2, 1);--backdrop-blur:blur(10px);--shadow-hover:0 25px 50px -12px rgba(0, 0, 0, 0.5);--shadow-active:0 4px 15px rgba(120, 113, 108, 0.3)}.gallery-item{transition:transform var(--transition-smooth),box-shadow var(--transition-smooth);backdrop-filter:var(--backdrop-blur);will-change:transform}.gallery-item:hover{transform:translateY(-8px) scale(1.02);box-shadow:var(--shadow-hover)}.academic-year-header{background:rgba(120,113,108,0.2);backdrop-filter:var(--backdrop-blur)}.filter-button{background:rgba(28,25,23,0.8);backdrop-filter:var(--backdrop-blur);transition:all var(--transition-fast);will-change:transform,background-color}.filter-button:hover{background:rgba(41,37,36,0.8);transform:translateY(-2px)}.filter-button.active{background:oklch(84.1% 0.238 128.85);color:oklch(20% 0 0);box-shadow:var(--shadow-active)}.filter-button[data-year="2020-2021"].active{background:oklch(70% 0.15 240)}.filter-button[data-year="2021-2022"].active{background:oklch(70% 0.15 160)}.filter-button[data-year="2022-2023"].active{background:oklch(70% 0.15 300)}.filter-button[data-year="2023-2024"].active{background:oklch(70% 0.15 30)}.filter-button[data-year="2024-2025"].active{background:oklch(70% 0.15 0)}.filter-button[data-year="2025-2026"].active{background:oklch(75% 0.15 85)}.loading-spinner{border:3px solid rgba(59,130,246,0.3);border-top:3px solid #3b82f6;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.fade-in{animation:fadeIn 0.6s ease-out}@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.gallery-item img{transition:opacity var(--transition-fast);background:rgba(120,113,108,0.1)}.gallery-item img[data-src]{opacity:0}.gallery-item img.loaded{opacity:1}.gallery-item img.error{opacity:0.5;background:rgba(239,68,68,0.1)}.filter-button:focus-visible,.gallery-item:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}@media (prefers-reduced-motion: reduce){.gallery-item,.filter-button,.fade-in{transition:none;animation:none}}</style> </head> <body class="bg-stone-900 min-h-screen text-stone-100"> <header class="bg-stone-800/50 backdrop-blur-md sticky top-0 z-50" role=banner> <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"> <div class="flex justify-center items-center py-6"> <h1 class="text-4xl font-bold text-stone-100">Progetti del corso di CVeDI</h1> </div> </div> </header> <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" role=main> <section class=mb-12 aria-labelledby=filter-heading> <h2 id=filter-heading class=sr-only>Filter projects by academic year</h2> <div class="flex justify-center"> <nav class="flex flex-wrap gap-3 justify-center" role=tablist aria-label="Academic year filters"> <button class="year-filter filter-button active px-6 py-3 text-stone-200 text-sm font-medium" data-year=all role=tab aria-selected=true aria-controls=gallery-container tabindex=0> <span class="flex items-center gap-2"> <svg class="w-4 h-4" fill=none stroke=currentColor viewBox="0 0 24 24" aria-hidden=true> <path stroke-linecap=round stroke-linejoin=round stroke-width=2 d="M4 6h16M4 10h16M4 14h16M4 18h16"></path> </svg> All Years </span> </button> <button class="year-filter filter-button px-6 py-3 text-stone-300 text-sm font-medium" data-year=2020-2021 role=tab aria-selected=false aria-controls=gallery-container tabindex=-1> A.A. 2020/2021 </button> <button class="year-filter filter-button px-6 py-3 text-stone-300 text-sm font-medium" data-year=2021-2022 role=tab aria-selected=false aria-controls=gallery-container tabindex=-1> A.A. 2021/2022 </button> <button class="year-filter filter-button px-6 py-3 text-stone-300 text-sm font-medium" data-year=2022-2023 role=tab aria-selected=false aria-controls=gallery-container tabindex=-1> A.A. 2022/2023 </button> <button class="year-filter filter-button px-6 py-3 text-stone-300 text-sm font-medium" data-year=2023-2024 role=tab aria-selected=false aria-controls=gallery-container tabindex=-1> A.A. 2023/2024 </button> <button class="year-filter filter-button px-6 py-3 text-stone-300 text-sm font-medium" data-year=2024-2025 role=tab aria-selected=false aria-controls=gallery-container tabindex=-1> A.A. 2024/2025 </button> <button class="year-filter filter-button px-6 py-3 text-stone-300 text-sm font-medium" data-year=2025-2026 role=tab aria-selected=false aria-controls=gallery-container tabindex=-1> A.A. 2025/2026 </button> </nav> </div> </section> <section id=gallery-container class=fade-in role=tabpanel aria-live=polite aria-label="Project gallery"> <div class="text-center py-16"> <div class="loading-spinner w-16 h-16 mx-auto" aria-hidden=true></div> <p class="mt-6 text-stone-400 text-lg">Loading projects...</p> </div> </section> </main> <footer class="bg-stone-800/50 backdrop-blur-md py-12 mt-20" role=contentinfo> <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"> <div class=text-center> <p class="text-stone-400 text-lg">&copy; 2025 Progetti del corso di CVeDI. All rights reserved.</p> <p class="text-stone-500 text-sm mt-2">Powered by modern web technologies</p> </div> </div> </footer> <script>let galleryData=[];let filteredData=[];let currentFilter="all";let imageObserver=null;const yearColors={"2020-2021":"border-blue-400","2021-2022":"border-emerald-400","2022-2023":"border-purple-400","2023-2024":"border-orange-400","2024-2025":"border-red-400","2025-2026":"border-amber-400"};async function loadGalleryData(){try{console.log("Loading gallery data...");const response=await fetch("gallery-data.json");console.log("Response status:",response.status);if(!response.ok){throw new Error(`HTTP error! status: ${response.status}`)}const data=await response.json();console.log("Data loaded:",data);galleryData=data.photos.map(photo=>({...photo,url:photo.url.replace(/^\//,"")}));filteredData=[...galleryData];renderGallery();setupEventListeners()}catch(error){console.error("Error loading gallery data:",error);document.getElementById("gallery-container").innerHTML=`<div class="text-center py-12 text-red-400">\n                        <div class="text-2xl mb-4">⚠️ Error loading gallery data</div>\n                        <div class="text-slate-400 mb-4">${error.message}</div>\n                        <div class="text-sm text-slate-500">Please check the console for more details</div>\n                    </div>`}}function renderGallery(){const container=document.getElementById("gallery-container");const groupedPhotos=groupPhotosByYear(filteredData);let html="";const academicYears=["2020-2021","2021-2022","2022-2023","2023-2024","2024-2025","2025-2026"];const projectBriefs={"2020-2021":"Siti web per organizzazioni no-profit e associazioni di volontariato","2021-2022":"Portali web per città immaginarie e ambientazioni fantasy","2022-2023":"Piattaforme web per progetti di sostenibilità ambientale","2023-2024":"Siti e-commerce per prodotti creativi e marketplace tematici","2024-2025":"Interfacce utente per sistemi totem e display interattivi","2025-2026":"Siti web per ristoranti e concept gastronomici"};academicYears.forEach(year=>{const photos=groupedPhotos[year]||[];if(photos.length===0&&currentFilter!=="all")return;const yearDisplay=year.replace("-","/");const colorClass=yearColors[year]||"border-gray-500";html+=`\n                    <section class="mb-16 fade-in" data-year="${year}" aria-labelledby="year-${year}">\n                        <div class="academic-year-header p-6 mb-8">\n                            <h2 id="year-${year}" class="text-3xl font-bold text-stone-100 mb-2">A.A. ${yearDisplay}</h2>\n                            <div class="w-20 h-1 ${colorClass.replace("border-","bg-")}"></div>\n                            <p class="mt-4 text-stone-300 italic">${projectBriefs[year]}</p>\n                        </div>\n                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8" role="grid" aria-label="Projects for academic year ${yearDisplay}">\n                `;photos.forEach(photo=>{html+=createPhotoCard(photo)});html+=`\n                        </div>\n                    </section>\n                `});container.innerHTML=html;setupLazyLoading()}function setupLazyLoading(){if(imageObserver){imageObserver.disconnect()}const images=document.querySelectorAll("img[data-src]");if("IntersectionObserver"in window){imageObserver=new IntersectionObserver((entries,observer)=>{entries.forEach(entry=>{if(entry.isIntersecting){const img=entry.target;const src=img.getAttribute("data-src");if(src){img.src=src;img.removeAttribute("data-src");img.addEventListener("load",()=>{img.classList.add("loaded")});img.addEventListener("error",()=>{img.classList.add("error")})}observer.unobserve(img)}})},{rootMargin:"50px 0px",threshold:.01});images.forEach(img=>imageObserver.observe(img))}else{images.forEach(img=>{const src=img.getAttribute("data-src");if(src){img.src=src;img.removeAttribute("data-src");img.addEventListener("load",()=>{img.classList.add("loaded")});img.addEventListener("error",()=>{img.classList.add("error")})}})}}function groupPhotosByYear(photos){return photos.reduce((groups,photo)=>{const year=photo["A.A."];if(!groups[year]){groups[year]=[]}groups[year].push(photo);return groups},{})}function createPhotoCard(photo){return`\n                <article class="gallery-item bg-stone-800/50 backdrop-blur-sm shadow-xl overflow-hidden cursor-pointer"\n                         data-name="${photo.name}"\n                         tabindex="0"\n                         role="button"\n                         aria-label="View project ${photo.name}">\n                    <div class="aspect-w-16 aspect-h-12 bg-stone-700/30">\n                        <img data-src="${photo.url}screenshot.webp"\n                             alt="Preview image for project ${photo.name}"\n                             class="w-full h-48 object-cover"\n                             data-full-image="${photo.url}screenshot.webp"\n                             data-project-url="${photo.url}"\n                             decoding="async"\n                             width="400"\n                             height="300">\n                    </div>\n                    <div class="p-6">\n                        <h3 class="text-lg font-semibold text-stone-100 mb-3 line-clamp-2">${photo.name}</h3>\n                    </div>\n                </article>\n            `}function setupEventListeners(){document.addEventListener("click",handleGalleryClick);document.addEventListener("keydown",handleGalleryKeydown);const yearFilters=document.querySelectorAll(".year-filter");yearFilters.forEach(button=>{button.addEventListener("click",handleYearFilter);button.addEventListener("keydown",handleYearFilterKeydown)})}function handleGalleryClick(e){const galleryItem=e.target.closest(".gallery-item");if(galleryItem){openProject(galleryItem)}}function handleGalleryKeydown(e){if(e.key==="Enter"||e.key===" "){const galleryItem=e.target.closest(".gallery-item");if(galleryItem){e.preventDefault();openProject(galleryItem)}}}function openProject(galleryItem){const name=galleryItem.getAttribute("data-name");const fullImageUrl=galleryItem.querySelector("img").getAttribute("data-project-url");window.open(fullImageUrl,"_blank","noopener,noreferrer")}function handleYearFilter(e){const selectedYear=this.getAttribute("data-year");updateFilter(selectedYear,this)}function handleYearFilterKeydown(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();const selectedYear=this.getAttribute("data-year");updateFilter(selectedYear,this)}else if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();navigateTabs(e.key==="ArrowLeft"?-1:1,this)}}function updateFilter(selectedYear,activeButton){currentFilter=selectedYear;const yearFilters=document.querySelectorAll(".year-filter");yearFilters.forEach(btn=>{btn.classList.remove("active");btn.setAttribute("aria-selected","false");btn.setAttribute("tabindex","-1")});activeButton.classList.add("active");activeButton.setAttribute("aria-selected","true");activeButton.setAttribute("tabindex","0");if(selectedYear==="all"){filteredData=[...galleryData]}else{filteredData=galleryData.filter(photo=>photo["A.A."]===selectedYear)}renderGallery()}function navigateTabs(direction,currentButton){const yearFilters=Array.from(document.querySelectorAll(".year-filter"));const currentIndex=yearFilters.indexOf(currentButton);const nextIndex=(currentIndex+direction+yearFilters.length)%yearFilters.length;const nextButton=yearFilters[nextIndex];nextButton.focus()}function cleanup(){if(imageObserver){imageObserver.disconnect();imageObserver=null}}document.addEventListener("DOMContentLoaded",loadGalleryData);window.addEventListener("beforeunload",cleanup);</script> </body> </html>
