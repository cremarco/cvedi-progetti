<!doctype html>
<html lang="it" data-theme="archive">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="I progetti del corso di CVeDI: esplora i siti realizzati dagli studenti, suddivisi per anno accademico.">
    <meta name="author" content="Corso di CVeDI">
    <meta property="og:title" content="Progetti del corso di CVeDI">
    <meta property="og:description" content="Esplora i progetti del corso di CVeDI per anno accademico.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#1c1917">
    <title>Progetti del corso di CVeDI</title>
    <link rel="preload" href="fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="gallery.css">
    <script src="gallery.js" defer></script>
  </head>
  <body id="top">
    <a class="skip-link btn" href="#gallery-container">Vai ai progetti</a>

    <header class="page-header page-width">
      <h1>Progetti del corso di CVeDI</h1>
      <div class="intro-row">
        <p>Esplora i progetti per anno accademico.</p>
        <p id="archive-summary" class="archive-summary"></p>
      </div>
    </header>

    <main>
      <section class="archive-toolbar" aria-label="Filtra i progetti">
        <div class="toolbar-inner page-width">
          <div class="year-scroll">
            <div id="year-filters" class="tabs year-filters" role="tablist" aria-label="Anno accademico">
              <button class="tab year-filter tab-active" id="filter-all" type="button" role="tab" aria-selected="true" aria-controls="gallery-container" data-year="all" disabled>Tutti gli anni</button>
            </div>
          </div>
          <form class="project-search input" role="search" aria-label="Cerca nei progetti">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            <label class="sr-only" for="project-search">Cerca un progetto per nome</label>
            <input id="project-search" type="search" placeholder="Cerca un progetto…" autocomplete="off" spellcheck="false" disabled>
            <button id="clear-search" class="btn btn-ghost btn-square" type="button" aria-label="Cancella ricerca" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
          </form>
        </div>
      </section>

      <div class="archive-content page-width">
        <div class="results-row">
          <p id="results-status" role="status" aria-live="polite" aria-atomic="true">Caricamento dei progetti…</p>
          <p class="sort-label">Dal più recente</p>
        </div>

        <div id="gallery-container" role="tabpanel" aria-labelledby="filter-all" tabindex="0" aria-busy="true">
          <div class="gallery-state" role="status">
            <span class="loading loading-spinner loading-md" aria-hidden="true"></span>
            <p>Caricamento dei progetti…</p>
          </div>
        </div>
        <noscript><p class="gallery-state">Attiva JavaScript nel browser per esplorare i progetti.</p></noscript>
      </div>
    </main>

    <footer class="page-footer page-width">
      <div>
        <p>Progetti del corso di CVeDI</p>
        <p class="footer-note">I progetti si aprono in una nuova scheda.</p>
      </div>
      <a class="link link-hover back-to-top" href="#top">Torna all’inizio <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></a>
    </footer>

    <template id="project-card">
      <article class="card gallery-item">
        <a class="project-link" target="_blank" rel="noopener noreferrer">
          <figure class="project-preview">
            <span class="image-fallback" hidden>Anteprima non disponibile</span>
          </figure>
          <div class="card-body project-caption">
            <svg class="project-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg>
          </div>
        </a>
      </article>
    </template>
  </body>
</html>
